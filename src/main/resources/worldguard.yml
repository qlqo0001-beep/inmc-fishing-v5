# ============================================================
#  WorldGuard 구역 규칙 (2세대 worldguard.yml 과 같은 형식)
#
#  WorldGuard 보호 구역마다 낚시를 막거나 등급 확률을 바꿉니다.
#  WorldGuard 가 없거나 아래가 비어 있으면 아무 영향이 없습니다.
#
#  world                    월드 이름 (Bukkit 월드 이름과 정확히 같아야 합니다)
#  region                   WorldGuard 보호 구역 이름
#  fishing-enabled          false 면 그 구역에서 낚시를 막습니다
#  grade-weight-multiplier  등급별 확률 배수. modifiers.yml 과 같은 방식으로 곱합니다
#                           (1.0 = 그대로, 2.0 = 두 배, 0.5 = 절반)
#
#  · 구역이 겹치면 **하나라도 금지면 금지**입니다. 배수는 전부 곱합니다.
#  · 항목 이름(spawn_lake 같은)은 알아보기 위한 것이고, 실제로는 world + region 으로 찾습니다.
#  · WorldGuard 플래그는 쓰지 않습니다. 이 파일 하나로 끝납니다.
# ============================================================
regions: {}

# 예시 — 주석을 풀어 쓰세요. 2세대는 이 예시가 켜진 채로 배포됐는데, 이름이 같은 구역
# (spawn_protection 등)이 있는 서버에서는 의도치 않게 낚시가 막히므로 5세대는 꺼둡니다.
# 2세대에서 옮겨 오는 서버는 쓰던 worldguard.yml 을 그대로 덮어쓰면 됩니다.
#
# regions:
#   spawn_lake:
#     world: world
#     region: fishing_lake
#     fishing-enabled: true
#     grade-weight-multiplier:
#       S: 1.5
#
#   no_fish_zone:
#     world: world
#     region: spawn_protection
#     fishing-enabled: false
