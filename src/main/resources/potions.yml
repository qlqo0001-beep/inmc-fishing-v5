# ============================================================
#  피로회복 물약 — 손에 들고 우클릭하면 한 개를 쓰고 즉시 회복합니다.
# ============================================================
#  자연 회복은 config.yml 의 fatigue.default 까지만 올라가지만, 물약은
#  **절대 상한(fatigue.max)** 까지 닿습니다. 그 차이가 물약의 존재 이유입니다.
#
#    amount  - 회복량
#    grade   - 연관 등급. /낚시 지급 물약 이 이걸로 찾습니다. 비워둬도 됩니다.
#              (2세대는 등급이 곧 키였습니다. 지금은 이름이 키라 같은 등급에
#               이벤트 물약·상점 물약을 여러 개 둘 수 있습니다.)
# ============================================================
