# ============================================================
#  inmc-fishing — 메시지
# ============================================================
# MiniMessage 표기를 씁니다: <red>빨강</red>, <gradient:#a:#b>…</gradient>
# 예전 색코드(&c, §c)도 그대로 읽히니 급하면 섞어 써도 됩니다.
#
# 줄을 통째로 지우면 내장 기본값이 나갑니다. 빈 문자열("")로 두면 그 메시지를 끕니다.
#
# 토큰은 한글/영문 둘 다 됩니다 — {물고기} = {fish}, {크기} = {size},
# {등급} = {grade}, {남은시간} = {remaining} …
#
# ⚠ 이 파일의 키 목록은 코드의 기본값 표와 **정확히 일치해야** 합니다.
#   `ResourceTest` 가 그걸 지킵니다 — 한쪽에만 있는 키는 관리자가 고쳐도 안 나오거나,
#   코드가 찾는데 파일에 없는 키입니다.
prefix: "<gradient:#3fb6ff:#9be7ff>[ 낚시 ]</gradient> "

# --- 낚시 기본 ---
bite: "<yellow>입질이 왔습니다! 순서대로 클릭하세요.</yellow>"
caught: "{grade} <white>{fish}</white> <gray>({size}cm)</gray> <green>를 낚았습니다!</green>"
caught-no-size: "{grade} <white>{fish}</white> <green>를 낚았습니다!</green>"
escaped: "<red>물고기가 도망갔습니다...</red>"
double: "<aqua>운이 좋군요! 두 마리를 낚았습니다.</aqua>"
big-fish: "<gold>대어! 이 종의 가장 큰 개체가 걸렸습니다 — 트로피 확정!</gold>"
inventory-full: "<red>인벤토리에 빈 칸이 없습니다.</red>"
world-not-allowed: "<red>이 월드에서는 낚시를 할 수 없습니다.</red>"
region-blocked: "<red>이 구역에서는 낚시할 수 없습니다.</red>"
disabled: "<red>낚시 기능이 꺼져 있습니다.</red>"

# --- 미니게임 ---
minigame-on: "<green>미니게임을 켰습니다.</green>"
minigame-off: "<yellow>미니게임을 껐습니다. 이제 자동으로 낚입니다.</yellow>"
minigame-locked: "<red>피로도가 부족해 자동 낚시를 할 수 없습니다.</red>"

# --- 트로피 ---
trophy: "<gold>트로피! <white>{fish}</white> <gray>({size}cm)</gray></gold>"
rare-trophy: "<light_purple>레어 트로피! <white>{fish}</white> <gray>({size}cm)</gray></light_purple>"
trophy-broadcast: "<gold>{player} 님이 {fish} 트로피({size}cm)를 낚았습니다!</gold>"
rare-trophy-broadcast: "<light_purple>{player} 님이 {fish} 레어 트로피({size}cm)를 낚았습니다!</light_purple>"

# --- 힘겨루기 ---
fight-line-snapped: "<red>줄이 끊겼네..</red>"
fight-distance: "<red>줄 길이가 부족하네..</red>"
fight-reel-broken: "<red>릴이 고장났네..</red>"
fight-timeout: "<red>시간이 초과되어 놓쳤네..</red>"
title-success: "&f잡았다!"
title-success-sub: "&a{sequence}"
title-fail: "&f물고기가 도망갔네.."
title-timeout: "&f물고기가 도망갔네.."
title-fail-sub: "&cL : 좌클릭 R : 우클릭"
fight-practice-win: "<yellow>[연습모드]</yellow> <gray>파이트 연습을 완료했습니다. (보상은 지급되지 않습니다.)</gray>"
practice-on-title: "&e&l연습모드 ON"
practice-on-subtitle: "&7보상 없이 트로피 파이트 연습"
practice-off-title: "&7연습모드 OFF"
show-broadcast: "<gold>[ 낚시 ]</gold> <white>{player}</white><gray> 님이 </gray>{grade} <white>{fish}</white><gray> ({size}cm) 을(를) 자랑합니다!</gray> {value}"
show-hold-fish: "<red>자랑할 물고기를 손에 들어 주세요.</red>"
stats-header: "<gray>────── <aqua>내 낚시 스탯</aqua> ──────</gray>"

# --- 도감 ---
collection-registered: "<green>{fish} 를 도감에 등록했습니다. ({count}/{amount})</green>"
collection-full: "<yellow>{fish} 도감이 이미 가득 찼습니다.</yellow>"
collection-perfect: "<gold>{fish} 도감을 퍼펙트 완성했습니다!</gold>"
collection-need-item: "<red>등록할 {fish} 가 없습니다.</red>"
collection-first: "<aqua>{fish} 를 처음으로 도감에 등록했습니다!</aqua>"
