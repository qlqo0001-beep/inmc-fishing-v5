collection-grade-done: "<green>{grade} 도감 일괄등록 완료: {count}개 등록했습니다.</green>"
collection-grade-empty: "<yellow>등록할 물고기가 없습니다. (인벤·배낭·어망 확인)</yellow>"

# --- 어망 ---
