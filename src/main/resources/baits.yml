# ============================================================
#  미끼 — 왼손(오프핸드)에 들면 적용되고, 입질마다 한 개 소모됩니다.
# ============================================================
#    grade-bonus         - 등급 id → 추첨 가중치에 **더할** 값. 낚싯대 보너스와 합산됩니다.
#    size-bonus-percent  - 크기에 곱할 %. **먼저** 적용됩니다.
#    size-bonus-fixed    - 크기에 더할 cm. 퍼센트 **뒤에** 더합니다.
#
#  ※ 미끼로 키운 크기는 max-size 를 넘을 수 있습니다. 의도된 동작입니다.
# ============================================================
