# ============================================================
#  inmc-fishing — 낚시
# ============================================================
# 등급은 grades.yml, 환경 보정은 modifiers.yml, 물고기와 낚싯대는
# /낚시 관리 화면에서 손에 든 것을 그대로 넣습니다.

settings:
  enabled: true
  # 낚시를 허용할 월드. **비워두면 모든 월드에서 됩니다.**
  # 하나씩 적게 하면 새 월드를 만들 때마다 "낚시가 안 된다"는 문의가 옵니다.
  allowed-worlds: []
  # 인벤토리에 빈 칸이 없으면 낚이지 않습니다.
  require-empty-slot: true
  # 넘치는 보상을 발밑에 흘립니다.
  drop-overflow-items: true
  debug: false
  # 등록하지 않은 바닐라 낚싯대로도 낚을 수 있습니다 (보너스는 없습니다).
  allow-unregistered-vanilla-rod: true

# ============================================================
#  미니게임 (입질 뒤 좌/우클릭)
# ============================================================
# 타이틀에 찍히는 글자와 진행 색입니다. 성공 타이틀의 {sequence} 도 이 글자를 씁니다.
# 전부 MiniMessage 이고 & 색 코드도 됩니다. /낚시 리로드 로 바로 바뀝니다.
#
# letters — 좌클릭·우클릭 글자. 비우면 L / R 입니다.
#   한글·기호도 되고, 리소스팩의 그림 글자(이미지)도 됩니다:
#     기본 글꼴의 글리프면   left: ""            (큰따옴표 안의 \u 는 그 문자)
#     따로 둔 글꼴이면       left: "<font:customfishing:icons>뀁</font>"
#   '<' 글자 자체는 작은따옴표로 left: '\<' 처럼 적습니다(큰따옴표 안의 \< 는 YAML 오류).
#
# colors — 글자 앞에 붙는 색. 글자마다 따로 그려 뒤 글자로 번지지 않으니 닫는 태그는 필요 없습니다.
#   pressed 누른 것 · current 지금 누를 것 · waiting 아직 안 누른 것. "" 이면 색 없음(흰색)입니다.
#   글자에 색을 넣으면 그 색이 이깁니다.
#   ⚠ 그림 글자는 색이 그림에 곱해집니다 — 원래 색으로 보이려면 <white>, 어둡게 하려면 <gray>·<dark_gray>.
#     <bold> 는 그림을 1칸 겹쳐 그려 번져 보이니 그림에는 빼세요.
minigame:
  letters:
    left: "L"
    right: "R"
  colors:
    pressed: "<dark_gray>"
    current: "<gold><bold>"
    waiting: "<white>"

# ============================================================
#  미니게임 끄기 (자동 낚시)
# ============================================================
# /낚시 미니게임 끄기 로 개인이 끌 수 있습니다. 끄면 클릭 없이 자동으로 낚이지만
# 등급별 대기 시간이 붙고, 피로도를 씁니다.
minigame-off:
  allow-player-toggle: true
  catch-delay-seconds:
    f: 5
    e: 10
    d: 20
    c: 40
    b: 60
    a: 120
    s: 300
  # 자동 낚시로 나올 수 있는 등급. 비우면 전부 허용입니다.
  allowed-grades: [f, e, d, c, b]

# ============================================================
#  미니게임 결과 타이틀 (2세대 messages.yml 의 titles)
# ============================================================
# 문구는 messages.yml 의 title-* 키입니다. 비우면 타이틀을 띄우지 않습니다.
titles:
  fade-in: 0.5
  display-seconds: 2.0
  fade-out: 0.5

# ============================================================
#  확률
# ============================================================
rates:
  # 보상이 두 개 나올 확률(%).
  double-chance: 7.0
  # 한 등급 위로 승급할 확률(%). 최상위 등급은 승급하지 않습니다.
  big-fish-chance: 1.0
  # 트로피 판정. 일반은 **평균 크기**의 배수, 레어는 **최대 크기**의 배수입니다.
  # 기준이 다른 이유: 평균만 쓰면 폭이 좁은 물고기에서 레어가 너무 쉽고,
  # 최대만 쓰면 폭이 넓은 물고기에서 일반 트로피조차 안 나옵니다.
  trophy-threshold: 1.45
  rare-trophy-threshold: 0.9

# ============================================================
#  어망
# ============================================================
# --- 도감 ---------------------------------------------------------------------
collection:
  # 물고기에 max-slots 를 적지 않았을 때 쓰는 도감 칸 수.
  # 칸을 다 채우면 퍼펙트가 되고, 퍼펙트는 도감 점수에서 칸 하나의 다섯 배로 쳐집니다.
  default-max-slots: 10


net:
  # 보관할 수 있는 마릿수. 0 이하면 무제한입니다.
  max-size: 100

# ============================================================
#  손질
# ============================================================
fillet:
  # 한 마리에서 기본으로 나오는 개수.
  base-yield: 3
  # 동시에 돌릴 수 있는 자리 수.
  default-slots: 3
  # false 면 한 자리씩 차례로 돕니다.
  concurrent-mode: true
  grade-times:
    f: 10
    e: 20
    d: 40
    c: 60
    b: 90
    a: 120
    s: 180
  trophy-multiplier: 1.5
  rare-trophy-multiplier: 2.0
  # 끄면 등급 시간만 쓰고 트로피 배수를 무시합니다.
  use-rarity-factor: true
  # 투입한 한 마리당 더해지는 시간(초).
  # ⚠ 트로피 배수는 **등급 시간에만** 곱해집니다. 여기까지 곱하면 트로피 여러 마리를
  #   한 번에 넣었을 때 시간이 폭발합니다.
  time-per-item: 5

# ============================================================
#  피로도 (자동 낚시 제어)
# ============================================================
# 직접 미니게임을 하는 사람은 영향을 받지 않습니다.
fatigue:
  default: 2000
  max: 20000
  recovery:
    # interval 초마다 amount 만큼 회복합니다. 접속을 끊은 동안도 회복합니다.
    amount: 100
    interval: 300
  # 이 값 **이하**로 떨어지면 자동 낚시가 잠깁니다.
  auto-minigame-lock-threshold: 0
  # 잠긴 뒤 이 값 **이상**이라야 풀립니다.
  # ⚠ 두 값을 같게 두지 마세요. 경계에서 잠금이 껐다 켜졌다 해서
  #   자동 낚시가 한 마리 잡고 멈추기를 반복합니다.
  auto-minigame-unlock-threshold: 100
  consume:
    f: 10
    e: 50
    d: 100
    c: 200
    b: 400
    a: 800
    s: 1600

# ============================================================
#  힘겨루기 (트로피 파이트)
# ============================================================
#  힘겨루기(트로피 파이트)는 fight.yml 에 있습니다 — 2세대와 같은 파일입니다.
# ============================================================

# ============================================================
#  보상 · 우편함 (core 공용)
# ============================================================
# 받을 때 인벤토리가 꽉 차 있거나 오프라인이면 우편함으로 갑니다.
rewards:
  mailbox-limit: 54
  mailbox-expire-seconds: 604800
  drop-when-full: true
  broadcast: true
  # 보관할 지난 시즌 기록 수.
  season-archive-limit: 10
