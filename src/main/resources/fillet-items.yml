  f_none:
    item: "minecraft:cod"
    material: "minecraft:cod"
    mode: REFERENCE
    name: "F급 생선살"
    display-name: "&7F급 생선살"
    lore:
      - "&7F급 물고기의 생선 살입니다."
    grade: f
    trophy-type: none

  f_trophy:
