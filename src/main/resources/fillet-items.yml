# ============================================================
#  생선살 — 손질하면 나오는 것
# ============================================================
#  **등급과 트로피 여부로만 찾습니다.** 물고기마다 결과물을 만들게 하면 물고기를
#  하나 추가할 때마다 결과물도 만들어야 하고, 빠뜨리면 손질했는데 아무것도 안 나옵니다.
#
#    grade        - 등급 id
#    trophy-type  - none(보통) / trophy(일반 트로피) / rare(레어 트로피)
#
#  ⚠ 2세대 fillet-items.yml 의 `normal` 은 "트로피가 **아님**" 이라는 뜻이었습니다.
#     같은 낱말이 정반대를 가리키므로 여기서는 `none` · `trophy` 로 적습니다.
#     (`normal` 이라고 적으면 뜻 그대로 "트로피 아님" 으로 읽힙니다.)
#
#  그 조합이 없으면 **한 단계 아래** 결과물이 나옵니다.
#  레어 → 일반 트로피 → 보통 순이고, 보통 칸이 비면 그 등급은 아무것도 안 나옵니다.
#
#  나오는 개수와 걸리는 시간은 config.yml 의 fillet 절에서 정합니다.
# ============================================================
fillets:

