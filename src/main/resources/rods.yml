# ============================================================
#  낚싯대
# ============================================================
#  /낚시 관리 → 낚싯대 에서 손에 든 것을 그대로 등록할 수 있습니다.
#
#  [보너스는 전부 더해지는 값입니다]
#    bonus                 - 등급 id → 추첨 가중치에 **더할** 값.
#                            곱셈이 아닌 이유: 가중치 1 인 S 에 2배를 줘봐야 1 이 늘 뿐입니다.
#    big-fish-chance-bonus - 대어 확률에 더할 %p. 대어는 반드시 트로피가 됩니다.
#    double-chance-bonus   - 더블 확률에 더할 %p.
#    options.max-fatigue      - 들고 있는 동안 **자연 회복 한계**를 올립니다(절대 상한은 못 넘음).
#    options.fatigue-recovery - 자연 회복 1회당 더 회복할 양.
#    options.reel-power       - 힘겨루기: 물고기 체력을 깎는 속도.
#    options.line-strength    - 힘겨루기: 줄이 버티는 장력. 도망 거리 상한도 같이 늘어납니다.
#    options.reel-durability  - 힘겨루기: 릴이 버티는 정도.
#    options.minigame-time    - 미니게임 제한 시간에 더할 초.
#    options.bait-save        - 입질 때 미끼를 쓰지 않을 확률(%).
#    options.size-bonus       - 물고기 크기에 더할 %. 미끼의 크기 보정과 합쳐집니다.
#    options.fatigue-save     - 자동 낚시로 낚을 때 피로도를 쓰지 않을 확률(%).
#    options.auto-catch-reduce - 자동 낚시 대기에서 뺄 초.
#
#  낚싯대에 붙은 커스텀 인첸트(inmc-enchants)의 낚시 수치도 이 값들에 더해집니다.
# ============================================================
