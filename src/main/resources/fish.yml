# ============================================================
#  낚을 수 있는 것 전부
# ============================================================
#  /낚시 관리 → 물고기 에서 손에 든 것을 그대로 등록할 수 있습니다.
#  손으로 고친 뒤에는 /낚시 리로드 를 실행하세요.
#
#  [아이템 정체]
#    item          - 참조. "minecraft:cod" · "mmoitems:MATERIAL:TUNA" · "itemsadder:내아이템"
#    mode          - REFERENCE(원본에서 매번 생성) / SNAPSHOT(등록 순간으로 고정)
#    material      - 빠른 거르개. 참조를 못 풀었을 때의 대체 재질이기도 합니다.
#    name          - **식별용 평문 이름.** 색코드를 넣지 마세요.
#    display-name  - **표시용 이름.** 색코드를 넣습니다.
#    lore          - 표시용 설명. 크기·트로피 줄은 낚일 때 자동으로 덧붙습니다.
#
#  [낚시 속성]
#    grade         - grades.yml 의 등급 id. 없는 등급을 적으면 영영 안 나옵니다.
#    weight        - 같은 등급 안에서의 추첨 가중치. 0 이면 안 나옵니다.
#    min/max/avg-size - cm. 셋 다 0 이면 크기 없는 것(쓰레기·광물)입니다.
#    double-enabled   - 더블 보상 대상인지. 쓰레기는 꺼두는 편이 좋습니다.
#    fatigue-recovery - 0 보다 크면 먹어서 피로도를 회복하는 아이템이 됩니다.
#    max-slots     - 도감 칸 수. 안 적으면 config.yml 의 collection.default-max-slots.
#    commands      - 낚였을 때 콘솔에서 실행. {player} 가 치환됩니다.
# ============================================================
